name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config from GitHub Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 -c '
          import os
          with open("firebase-config.js", "r", encoding="utf-8") as f:
              content = f.read()
          replacements = {
              "__FIREBASE_API_KEY__": os.environ["FIREBASE_API_KEY"],
              "__FIREBASE_AUTH_DOMAIN__": os.environ["FIREBASE_AUTH_DOMAIN"],
              "__FIREBASE_PROJECT_ID__": os.environ["FIREBASE_PROJECT_ID"],
              "__FIREBASE_STORAGE_BUCKET__": os.environ["FIREBASE_STORAGE_BUCKET"],
              "__FIREBASE_MESSAGING_SENDER_ID__": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
              "__FIREBASE_APP_ID__": os.environ["FIREBASE_APP_ID"],
          }
          for key, val in replacements.items():
              content = content.replace(key, val)
          with open("firebase-config.js", "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4